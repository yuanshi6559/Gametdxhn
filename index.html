<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>请和我打游戏 ♡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(160deg,#ffe4ec 0%,#fff0f5 45%,#e6f0ff 100%);}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes wobble{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
  @keyframes pop{0%{transform:scale(0) rotate(-15deg);opacity:0}70%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
  @keyframes heartUp{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-110vh) scale(1.3);opacity:0}}
  .heart{position:fixed;bottom:-40px;pointer-events:none;animation:heartUp linear forwards;}
  .btn{transition:transform .25s cubic-bezier(.34,1.56,.64,1);border:none;outline:none;cursor:pointer;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12);}
  .btn:active{transform:scale(.94)!important;}
  #askBox{text-align:center;z-index:5;padding:0 20px;}
  #thanksBox{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;background:linear-gradient(160deg,#ffe4ec,#e6f0ff);}
</style>
</head>
<body>
<div id="stage">
  <div id="askBox">
    <div style="font-size:70px;animation:floaty 3s ease-in-out infinite;">🎮</div>
    <div style="font-size:34px;font-weight:900;color:#ff6b9d;margin:14px 0 6px;letter-spacing:2px;text-shadow:2px 2px 0 #fff;">请和我打游戏</div>
    <div style="font-size:16px;color:#c98bb0;margin-bottom:48px;">好不好嘛 (｡•̀ᴗ-)✧</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:22px;">
      <button id="yes" class="btn" style="background:linear-gradient(180deg,#ff8fb3,#ff6b9d);color:#fff;font-size:24px;padding:16px 60px;border-radius:999px;">同意 ♡</button>
      <button id="no" class="btn" style="background:#fff;color:#9aa7bd;font-size:18px;padding:12px 40px;border-radius:999px;border:2px solid #e3e9f4;">拒绝</button>
    </div>
    <div id="hint" style="margin-top:30px;font-size:13px;color:#c0a9bb;opacity:0;transition:opacity .3s;">哎呀，拒绝键好像不太听话…</div>
  </div>

  <div id="thanksBox">
    <div style="font-size:70px;animation:wobble 1.2s ease-in-out infinite;">🥰</div>
    <div style="font-size:64px;font-weight:900;color:#ff6b9d;margin-top:10px;letter-spacing:4px;text-shadow:3px 3px 0 #fff,-2px -2px 0 #ffd6e4;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;">谢谢！♡</div>
    <div style="font-size:18px;color:#c98bb0;margin-top:16px;">就知道你最好啦，上号！</div>
  </div>
</div>

<script>
(function(){
  var no=document.getElementById('no'),yes=document.getElementById('yes'),
      stage=document.getElementById('stage'),hint=document.getElementById('hint');
  var dodges=0,maxDodge=6,noScale=1,yesScale=1;
  var phrases=['哎呀，没点到吧','拒绝键正在逃跑…','它说不想拒绝你','再试试？抓不到哒','它躲得越来越快了','放弃吧，只有同意♡'];

  function dodge(){
    dodges++;
    noScale=Math.max(.35,noScale-.11);yesScale=Math.min(1.9,yesScale+.16);
    var w=stage.clientWidth,h=stage.clientHeight,bw=no.offsetWidth,bh=no.offsetHeight;
    no.style.position='fixed';
    no.style.left=(20+Math.random()*Math.max(20,w-bw-40))+'px';
    no.style.top=(h*.35+Math.random()*Math.max(20,h*.55-bh))+'px';
    no.style.transform='scale('+noScale+')';
    yes.style.transform='scale('+yesScale+')';
    hint.textContent=phrases[Math.min(dodges-1,phrases.length-1)];
    hint.style.opacity=1;
    if(navigator.vibrate)navigator.vibrate(15);
  }
  no.addEventListener('pointerdown',function(e){e.preventDefault();dodge();});
  no.addEventListener('pointerenter',function(){if(dodges<maxDodge)dodge();});

  function hearts(){
    for(var i=0;i<16;i++){
      setTimeout(function(){
        var s=document.createElement('div');s.className='heart';
        s.textContent=Math.random()<.5?'💖':(Math.random()<.5?'🎮':'✨');
        s.style.left=Math.random()*100+'vw';
        s.style.fontSize=(20+Math.random()*26)+'px';
        s.style.animationDuration=(2.5+Math.random()*2)+'s';
        document.body.appendChild(s);
        setTimeout(function(){s.remove();},5000);
      },i*130);
    }
  }
  yes.addEventListener('pointerdown',function(e){
    e.preventDefault();
    document.getElementById('askBox').style.display='none';
    var t=document.getElementById('thanksBox');t.style.display='flex';
    hearts();if(navigator.vibrate)navigator.vibrate([30,50,30]);
  });
})();
</script>
</body>
</html>
